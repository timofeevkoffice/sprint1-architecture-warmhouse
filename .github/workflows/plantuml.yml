name: PlantUML Diagrams

on:
  push:
    branches:
      - warmhouse
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PNG side by side with .puml
        run: |
          docker run --rm -v ${{ github.workspace }}:/data plantuml/plantuml -tpng "/data/C4/**/*.puml"

      - name: Commit and push generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Добавляем только PNG-файлы внутри C4
          git add 'C4/**/*.png'
          if ! git diff --cached --quiet; then
            git commit -m "Автоматическая генерация PNG-диаграмм C4"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "Нет новых PNG для коммита"
          fi