name: PlantUML Diagrams

on:
  push:
    branches:
      - warmhouse
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PNG (side by side with .puml)
        run: |
          docker run --rm -v ${{ github.workspace }}:/data plantuml/plantuml -tpng "/data/C4/**/*.puml"

      - name: Copy the whole C4 structure into diagrams/
        run: |
          mkdir -p diagrams
          cp -r C4 diagrams/

      - name: Commit and push diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/
          if ! git diff --cached --quiet; then
            git commit -m "Автоматическая генерация диаграмм C4 (с сохранением структуры)"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi